[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
# Sepolia is on the Amsterdam schedule. A fresh SSTORE costs about 108k gas there.
# Cancun prices it at 20k, which hides the callback out-of-gas this lab hit.
evm_version = "amsterdam"
optimizer = true
optimizer_runs = 200
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
reactive = "https://mainnet-rpc.rnk.dev/"
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "https://sepolia.base.org"
unichain_sepolia = "https://sepolia.unichain.org"
