[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
# Lasna executes Cancun bytecode. Amsterdam simulation reverts inside forge script
# on Lasna, so production builds stay on cancun. The Sepolia SSTORE gas test is run
# separately with: forge test --evm-version amsterdam --match-path test/D5CallbackGas.t.sol
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
reactive = "https://mainnet-rpc.rnk.dev/"
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "https://sepolia.base.org"
unichain_sepolia = "https://sepolia.unichain.org"
